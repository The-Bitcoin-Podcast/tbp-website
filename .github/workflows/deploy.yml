name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests run the build only and attach the built site as a downloadable
  # preview; nothing is deployed.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tbp-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tbp-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Builds the clip-search index, then the static site into tbp-next/out,
      # reading Markdown from ../content and static files from ../quartz/static.
      - name: Build site
        run: npm run build
      # On pull requests: attach the built site to the run so reviewers can
      # download it and look at it locally (see tbp-next/README.md).
      - name: Upload preview build
        id: preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: tbp-next/out
          include-hidden-files: true
          retention-days: 14
      - name: Link the preview in the run summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Site preview"
            echo "[Download the built site](${{ steps.preview.outputs.artifact-url }}) (zip, kept for 14 days)."
            echo
            echo "Unzip it, then run \`npx serve <unzipped folder>\` and open the address it prints."
            echo "Opening index.html directly does not work; the site needs to be served."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: tbp-next/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The episode sync publishes without anyone watching, so say so when a
  # deploy doesn't go through.
  notify-failure:
    if: failure() && github.event_name != 'pull_request'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report the failed deploy on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -fsS -H "Content-Type: application/json" \
            -d "{\"content\":\"The site deploy failed, so the live site was not updated.\\n$RUN_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
